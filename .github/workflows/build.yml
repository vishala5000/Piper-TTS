name: Build Piper TTS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnx==1.17.0

      - name: Create directories
        run: |
          mkdir -p build/piper
          mkdir -p app/src/main/assets/ryan
          mkdir -p app/src/main/jniLibs/arm64-v8a

      - name: Download Ryan High Piper model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pipertts \
            --repo vishala5000/Piper-TTS \
            --pattern "en_US-ryan-high.onnx" \
            --pattern "en_US-ryan-high.onnx.json" \
            --dir build/piper

          echo "Downloaded Piper files:"
          ls -lh build/piper

      - name: Verify Piper model
        run: |
          if [ ! -f "build/piper/en_US-ryan-high.onnx" ]; then
            echo "ERROR: Piper ONNX model not found"
            exit 1
          fi

          if [ ! -f "build/piper/en_US-ryan-high.onnx.json" ]; then
            echo "ERROR: Piper JSON config not found"
            exit 1
          fi

          echo "Piper model files found."

      - name: Prepare Piper model
        run: |
          python scripts/prepare_piper.py \
            build/piper/en_US-ryan-high.onnx \
            app/src/main/assets/ryan

          echo "Prepared Piper assets:"
          ls -lh app/src/main/assets/ryan

      - name: Verify prepared Piper model
        run: |
          if [ ! -f "app/src/main/assets/ryan/en_US-ryan-high.onnx" ]; then
            echo "ERROR: Prepared ONNX model missing"
            exit 1
          fi

          if [ ! -f "app/src/main/assets/ryan/tokens.txt" ]; then
            echo "ERROR: tokens.txt missing"
            exit 1
          fi

          echo "Prepared Piper model verified."

      - name: Download eSpeak NG data
        run: |
          cd app/src/main/assets/ryan

          rm -rf espeak-ng-data
          rm -f espeak-ng-data.tar.bz2

          curl --fail --location --retry 5 \
            -o espeak-ng-data.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/espeak-ng-data.tar.bz2"

          echo "Extracting eSpeak NG data..."

          tar -xjf espeak-ng-data.tar.bz2

          rm -f espeak-ng-data.tar.bz2

          echo "Extracted directories:"
          find . -maxdepth 3 -type d | sort

          if [ -d "espeak-ng-data" ]; then
            echo "eSpeak NG data found correctly."
          else
            echo "eSpeak NG directory not found."

            FOUND=$(find . -type d -name "espeak-ng-data" | head -n 1)

            if [ -n "$FOUND" ]; then
              echo "Found at: $FOUND"
              mv "$FOUND" ./espeak-ng-data
            else
              echo "ERROR: espeak-ng-data could not be found."
              exit 1
            fi
          fi

          echo "Final eSpeak NG directory:"
          ls -lah espeak-ng-data

      - name: Download sherpa-onnx Android package
        run: |
          curl --fail --location --retry 5 \
            -o build/sherpa-onnx-android.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2"

          mkdir -p build/sherpa-onnx

          tar -xjf \
            build/sherpa-onnx-android.tar.bz2 \
            -C build/sherpa-onnx

          echo "sherpa-onnx package extracted."

      - name: Find sherpa native libraries
        run: |
          echo "Searching for native libraries..."

          find build/sherpa-onnx \
            -type f \
            -name "*.so" \
            -print

      - name: Copy ARM64 native libraries
        run: |
          ARM64_DIR=$(find build/sherpa-onnx \
            -type d \
            -name "arm64-v8a" \
            | head -n 1)

          if [ -z "$ARM64_DIR" ]; then
            echo "ERROR: arm64-v8a directory not found"
            echo ""
            echo "Available directories:"
            find build/sherpa-onnx -type d | head -100
            exit 1
          fi

          echo "ARM64 directory:"
          echo "$ARM64_DIR"

          find "$ARM64_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.so" \
            -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;

          echo ""
          echo "Copied native libraries:"
          ls -lh app/src/main/jniLibs/arm64-v8a

      - name: Download official sherpa Kotlin API
        run: |
          mkdir -p \
            app/src/main/java/com/k2fsa/sherpa/onnx

          curl --fail --location --retry 5 \
            -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt \
            "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/sherpa-onnx/kotlin-api/Tts.kt"

          if [ ! -s "app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt" ]; then
            echo "ERROR: Tts.kt was not downloaded"
            exit 1
          fi

          echo "Tts.kt downloaded successfully:"
          ls -lh \
            app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

      - name: Verify project files
        run: |
          echo "========================================"
          echo "CHECKING REQUIRED FILES"
          echo "========================================"

          FAILED=0

          check_file() {
            if [ -f "$1" ]; then
              echo "OK   FILE: $1"
            else
              echo "FAIL FILE: $1"
              FAILED=1
            fi
          }

          check_dir() {
            if [ -d "$1" ]; then
              echo "OK   DIR : $1"
            else
              echo "FAIL DIR : $1"
              FAILED=1
            fi
          }

          check_file "settings.gradle.kts"
          check_file "build.gradle.kts"
          check_file "gradle.properties"

          check_file "app/build.gradle.kts"
          check_file "app/proguard-rules.pro"

          check_file "app/src/main/AndroidManifest.xml"

          check_file \
            "app/src/main/java/com/vishal/pipertts/MainActivity.kt"

          check_file \
            "app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt"

          check_file \
            "app/src/main/assets/ryan/en_US-ryan-high.onnx"

          check_file \
            "app/src/main/assets/ryan/tokens.txt"

          check_dir \
            "app/src/main/assets/ryan/espeak-ng-data"

          check_file \
            "app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so"

          check_file \
            "app/src/main/jniLibs/arm64-v8a/libonnxruntime.so"

          echo ""
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: REQUIRED FILES ARE MISSING"
            echo "========================================"
            exit 1
          fi

          echo "ALL REQUIRED FILES FOUND"
          echo "========================================"

      - name: Show project structure
        run: |
          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          find app/src/main \
            -maxdepth 8 \
            -type f \
            | sort

          echo "========================================"

      - name: Build APK
        run: |
          echo "========================================"
          echo "STARTING GRADLE BUILD"
          echo "========================================"

          gradle clean assembleRelease --stacktrace

          echo ""
          echo "========================================"
          echo "GRADLE BUILD FINISHED"
          echo "========================================"

      - name: Find and verify APK
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          echo ""
          echo "All APK files:"
          find . -type f -name "*.apk" -print

          echo ""
          echo "Release build directory:"
          find app/build/outputs \
            -maxdepth 8 \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: NO APK WAS CREATED"
            echo ""
            echo "Gradle did not produce an APK."
            echo ""
            echo "Checking build directory:"
            find app/build \
              -maxdepth 10 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo ""
          echo "APK SIZE:"
          ls -lh "$APK"

          cp "$APK" PiperTTS-RyanHigh.apk

          echo ""
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh PiperTTS-RyanHigh.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiperTTS-RyanHigh
          path: PiperTTS-RyanHigh.apk
          if-no-files-found: error
