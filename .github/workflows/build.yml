name: Build Piper TTS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install onnx==1.17.0


      # ============================================================
      # CREATE DIRECTORIES
      # ============================================================

      - name: Create required directories
        run: |

          mkdir -p build/piper

          mkdir -p app/src/main/assets/ryan

          mkdir -p app/src/main/jniLibs/arm64-v8a


      # ============================================================
      # DOWNLOAD RYAN MEDIUM
      #
      # IMPORTANT:
      # Your pipertts GitHub Release must contain:
      #
      # en_US-ryan-high.onnx
      # en_US-ryan-high.onnx.json
      # ============================================================

      - name: Download Ryan Medium Piper model
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          echo "========================================"
          echo "DOWNLOADING RYAN MEDIUM"
          echo "========================================"

          gh release download pipertts \
            --repo vishala5000/Piper-TTS \
            --pattern "en_US-ryan-high.onnx" \
            --pattern "en_US-ryan-high.onnx.json" \
            --dir build/piper

          echo ""
          echo "Downloaded files:"
          ls -lh build/piper


      # ============================================================
      # VERIFY MODEL
      # ============================================================

      - name: Verify Ryan Medium model
        run: |

          echo "========================================"
          echo "VERIFYING RYAN MEDIUM"
          echo "========================================"

          test -f \
            build/piper/en_US-ryan-high.onnx

          test -f \
            build/piper/en_US-ryan-high.onnx.json

          echo ""
          echo "[OK] Ryan Medium model found."


      # ============================================================
      # PREPARE PIPER
      #
      # Creates:
      #
      # en_US-ryan-high.onnx
      # tokens.txt
      #
      # and adds sherpa-compatible metadata.
      # ============================================================

      - name: Prepare Piper model
        run: |

          echo "========================================"
          echo "PREPARING PIPER MODEL"
          echo "========================================"

          python scripts/prepare_piper.py \
            build/piper/en_US-ryan-high.onnx \
            app/src/main/assets/ryan

          echo ""
          echo "Prepared Piper assets:"
          ls -lh app/src/main/assets/ryan


      # ============================================================
      # VERIFY PREPARED MODEL
      # ============================================================

      - name: Verify prepared Piper model
        run: |

          echo "========================================"
          echo "VERIFYING PREPARED MODEL"
          echo "========================================"

          test -f \
            app/src/main/assets/ryan/en_US-ryan-high.onnx

          test -f \
            app/src/main/assets/ryan/tokens.txt

          echo ""
          echo "[OK] Model verified."
          echo "[OK] tokens.txt verified."


      # ============================================================
      # DOWNLOAD ESPEAK NG DATA
      # ============================================================

      - name: Download eSpeak NG data
        run: |

          echo "========================================"
          echo "DOWNLOADING ESPEAK-NG DATA"
          echo "========================================"

          cd app/src/main/assets/ryan

          rm -rf espeak-ng-data

          rm -f espeak-ng-data.tar.bz2


          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            -o espeak-ng-data.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/espeak-ng-data.tar.bz2"


          tar \
            -xjf \
            espeak-ng-data.tar.bz2


          rm -f espeak-ng-data.tar.bz2


          if [ ! -d "espeak-ng-data" ]; then

            FOUND=$(
              find . \
                -type d \
                -name "espeak-ng-data" \
                | head -n 1
            )


            if [ -n "$FOUND" ]; then

              mv \
                "$FOUND" \
                ./espeak-ng-data

            else

              echo ""
              echo "ERROR:"
              echo "espeak-ng-data directory was not found."

              exit 1
            fi
          fi


          echo ""
          echo "eSpeak NG data verified."

          echo ""
          echo "Top-level contents:"

          find \
            espeak-ng-data \
            -maxdepth 2 \
            -type f \
            | head -50


      # ============================================================
      # DOWNLOAD SHERPA ONNX ANDROID PACKAGE
      # ============================================================

      - name: Download sherpa-onnx Android package
        run: |

          echo "========================================"
          echo "DOWNLOADING SHERPA-ONNX v1.13.8"
          echo "========================================"


          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            -o build/sherpa-onnx-android.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2"


          mkdir -p build/sherpa-onnx


          tar \
            -xjf \
            build/sherpa-onnx-android.tar.bz2 \
            -C build/sherpa-onnx


          echo ""
          echo "[OK] sherpa-onnx package extracted."


      # ============================================================
      # SHOW NATIVE LIBRARIES
      # ============================================================

      - name: Find sherpa native libraries
        run: |

          echo "========================================"
          echo "NATIVE LIBRARIES"
          echo "========================================"

          find \
            build/sherpa-onnx \
            -type f \
            -name "*.so" \
            -print


      # ============================================================
      # COPY ARM64 NATIVE LIBRARIES
      # ============================================================

      - name: Copy ARM64 native libraries
        run: |

          echo "========================================"
          echo "COPYING ARM64 LIBRARIES"
          echo "========================================"


          ARM64_DIR=$(
            find build/sherpa-onnx \
              -type d \
              -name "arm64-v8a" \
              | head -n 1
          )


          if [ -z "$ARM64_DIR" ]; then

            echo ""
            echo "ERROR:"
            echo "arm64-v8a directory was not found."

            echo ""
            echo "Available directories:"

            find \
              build/sherpa-onnx \
              -type d \
              | head -100

            exit 1
          fi


          echo ""
          echo "ARM64 directory:"
          echo "$ARM64_DIR"


          find "$ARM64_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.so" \
            -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;


          echo ""
          echo "Copied native libraries:"

          ls -lh \
            app/src/main/jniLibs/arm64-v8a


      # ============================================================
      # DOWNLOAD OFFICIAL SHERPA KOTLIN API
      # ============================================================

      - name: Download sherpa Kotlin API
        run: |

          echo "========================================"
          echo "DOWNLOADING SHERPA KOTLIN API"
          echo "========================================"


          mkdir -p \
            app/src/main/java/com/k2fsa/sherpa/onnx


          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            -o \
            app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt \
            "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/sherpa-onnx/kotlin-api/Tts.kt"


          test -s \
            app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt


          echo ""
          echo "[OK] Tts.kt downloaded."


      # ============================================================
      # VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify MainActivity
        run: |

          echo "========================================"
          echo "VERIFYING MAIN ACTIVITY"
          echo "========================================"


          test -f \
            app/src/main/java/com/vishal/pipertts/MainActivity.kt


          echo "[OK] MainActivity.kt found."


      # ============================================================
      # VERIFY REQUIRED PROJECT FILES
      # ============================================================

      - name: Verify project files
        run: |

          echo "========================================"
          echo "VERIFYING PROJECT"
          echo "========================================"


          FAILED=0


          check_file() {

            if [ -f "$1" ]; then

              echo "OK   FILE: $1"

            else

              echo "FAIL FILE: $1"

              FAILED=1

            fi
          }


          check_dir() {

            if [ -d "$1" ]; then

              echo "OK   DIR : $1"

            else

              echo "FAIL DIR : $1"

              FAILED=1

            fi
          }


          check_file "settings.gradle.kts"

          check_file "build.gradle.kts"

          check_file "gradle.properties"

          check_file "app/build.gradle.kts"

          check_file "app/proguard-rules.pro"

          check_file "app/src/main/AndroidManifest.xml"

          check_file \
            "app/src/main/java/com/vishal/pipertts/MainActivity.kt"

          check_file \
            "app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt"

          check_file \
            "app/src/main/assets/ryan/en_US-ryan-high.onnx"

          check_file \
            "app/src/main/assets/ryan/tokens.txt"

          check_dir \
            "app/src/main/assets/ryan/espeak-ng-data"

          check_file \
            "app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so"

          check_file \
            "app/src/main/jniLibs/arm64-v8a/libonnxruntime.so"


          if [ "$FAILED" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "ERROR: REQUIRED FILES ARE MISSING"
            echo "========================================"

            exit 1
          fi


          echo ""
          echo "========================================"
          echo "ALL REQUIRED FILES FOUND"
          echo "========================================"


      # ============================================================
      # SHOW FINAL PROJECT STRUCTURE
      # ============================================================

      - name: Show project structure
        run: |

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"


          find app/src/main \
            -maxdepth 8 \
            -type f \
            | sort


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build APK
        run: |

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"


          gradle \
            clean \
            assembleRelease \
            --stacktrace


          echo ""
          echo "========================================"
          echo "GRADLE BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Verify and locate APK
        run: |

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"


          echo ""
          echo "All APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -print


          echo ""
          echo "Build outputs:"

          find app/build/outputs \
            -maxdepth 10 \
            -type f \
            -print \
            2>/dev/null || true


          APK=$(
            find app/build/outputs \
              -type f \
              -name "*.apk" \
              | head -n 1
          )


          if [ -z "$APK" ]; then

            echo ""
            echo "========================================"
            echo "ERROR: NO APK WAS CREATED"
            echo "========================================"

            exit 1
          fi


          echo ""
          echo "APK FOUND:"
          echo "$APK"


          echo ""
          echo "APK SIZE:"

          ls -lh "$APK"


          cp \
            "$APK" \
            PiperTTS-RyanHigh.apk


          echo ""
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"


          ls -lh \
            PiperTTS-RyanHigh.apk


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: PiperTTS-RyanHigh

          path: PiperTTS-RyanHigh.apk

          if-no-files-found: error
