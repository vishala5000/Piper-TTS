name: Build Piper TTS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnx==1.17.0

      - name: Create directories
        run: |
          mkdir -p build/piper
          mkdir -p app/src/main/assets/ryan
          mkdir -p app/src/main/jniLibs/arm64-v8a

      - name: Download Ryan High Piper model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pipertts \
            --repo vishala5000/Piper-TTS \
            --pattern "en_US-ryan-high.onnx" \
            --pattern "en_US-ryan-high.onnx.json" \
            --dir build/piper

          echo "Downloaded files:"
          ls -lh build/piper

      - name: Verify Piper model
        run: |
          test -f build/piper/en_US-ryan-high.onnx
          test -f build/piper/en_US-ryan-high.onnx.json

      - name: Prepare Piper model
        run: |
          python scripts/prepare_piper.py \
            build/piper/en_US-ryan-high.onnx \
            app/src/main/assets/ryan

      - name: Download eSpeak NG data
        run: |
          cd app/src/main/assets

          curl --fail --location --retry 5 \
            -o espeak-ng-data.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/espeak-ng-data.tar.bz2"

          tar -xjf espeak-ng-data.tar.bz2

          rm espeak-ng-data.tar.bz2

          test -d espeak-ng-data

      - name: Download sherpa-onnx Android package
        run: |
          curl --fail --location --retry 5 \
            -o build/sherpa-onnx-android.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2"

          mkdir -p build/sherpa-onnx

          tar -xjf \
            build/sherpa-onnx-android.tar.bz2 \
            -C build/sherpa-onnx

      - name: Find sherpa native libraries
        run: |
          echo "Searching for native libraries..."

          find build/sherpa-onnx \
            -type f \
            -name "*.so" \
            -print

      - name: Copy ARM64 native libraries
        run: |
          ARM64_DIR=$(find build/sherpa-onnx \
            -type d \
            -name "arm64-v8a" \
            | head -n 1)

          if [ -z "$ARM64_DIR" ]; then
            echo "ERROR: arm64-v8a directory not found"
            exit 1
          fi

          echo "Using ARM64 directory:"
          echo "$ARM64_DIR"

          cp "$ARM64_DIR"/*.so \
            app/src/main/jniLibs/arm64-v8a/

          echo "Copied native libraries:"
          ls -lh \
            app/src/main/jniLibs/arm64-v8a/

      - name: Download official sherpa Kotlin API
        run: |
          mkdir -p \
            app/src/main/java/com/k2fsa/sherpa/onnx

          curl --fail --location --retry 5 \
            -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt \
            "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/sherpa-onnx/kotlin-api/Tts.kt"

          test -s \
            app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

          echo "Downloaded Tts.kt:"
          ls -lh \
            app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

          echo "First lines:"
          head -n 10 \
            app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

      - name: Verify project files
        run: |
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/vishal/pipertts/MainActivity.kt

          test -f app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

          test -f app/src/main/assets/ryan/en_US-ryan-high.onnx
          test -f app/src/main/assets/ryan/tokens.txt
          test -d app/src/main/assets/ryan/espeak-ng-data

          echo "All required files found."

      - name: Build APK
        run: |
          gradle clean assembleRelease --stacktrace

      - name: Verify APK
        run: |
          test -f \
            app/build/outputs/apk/release/app-release.apk

          echo "APK successfully created:"
          ls -lh \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            PiperTTS-RyanHigh.apk

          ls -lh PiperTTS-RyanHigh.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiperTTS-RyanHigh
          path: PiperTTS-RyanHigh.apk
